<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d0d0d">
<meta name="description" content="Narua, food truck de comida asiática de rua em São Paulo. Veja o cardápio com fotos e preços e onde o food truck está hoje.">
<meta property="og:title" content="Narua · Comida asiática de rua">
<meta property="og:description" content="Cardápio com fotos e preços e onde o food truck está hoje.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%9C%3C/text%3E%3C/svg%3E">
<title>Narua · Comida asiática de rua</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Poppins:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0d0d;
    --paper:#f7f1e2;
    --ink:#181818;
    --ink-soft:#5c564a;
    --orange:#f6af43;
    --orange2:#f49140;
    --red:#e73334;
    --green:#2e9e4f;
    --cyan:#40d5e8;
    --line:#e3dac1;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 8%, rgba(246,175,67,0.10) 0%, transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(64,213,232,0.08) 0%, transparent 40%),
      var(--bg);
    background-attachment:fixed;
    color:var(--paper);
    font-family:'Poppins',sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:980px;margin:0 auto;padding:0 44px;}

  /* ---------- topo ---------- */
  header{padding:34px 44px 8px;text-align:center;}
  header .wordmark{font-family:'Titan One',cursive;font-size:56px;line-height:1.05;letter-spacing:.02em;color:var(--paper);-webkit-text-stroke:3px var(--ink);text-shadow:4px 4px 0 var(--orange2);}
  header .wordmark .u{color:var(--orange);}
  header .eyebrow{font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--orange);margin-top:6px;}
  header h1{font-weight:700;font-size:18px;margin:6px 0 0;color:var(--paper);}

  .side-wave{position:fixed;top:0;height:100vh;width:36px;z-index:5;pointer-events:none;}
  .side-wave-left{left:0;}
  .side-wave-right{right:0;}

  .aviso-exemplo{margin:14px auto 0;max-width:520px;background:#fff6ea;border:2px solid var(--orange2);color:#8a5a12;border-radius:10px;padding:9px 12px;font-size:12.5px;font-weight:600;text-align:center;}

  /* ---------- categorias ---------- */
  .cat-nav{position:sticky;top:0;z-index:4;background:rgba(13,13,13,0.94);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding:12px 0;margin:14px 0 6px;border-bottom:2px solid #222;}
  .cat-nav .lista{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px;}
  .cat-nav .lista::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:8px 14px;font-family:'Poppins',sans-serif;font-weight:700;font-size:13.5px;cursor:pointer;box-shadow:2px 2px 0 var(--orange2);white-space:nowrap;}
  .chip.ativo{background:var(--orange);box-shadow:2px 2px 0 var(--paper);}
  .chip:focus-visible{outline:3px solid var(--cyan);outline-offset:2px;}

  /* ---------- seções e cartões ---------- */
  .secao{padding-top:22px;scroll-margin-top:70px;}
  .secao-titulo{font-family:'Titan One',cursive;font-size:26px;font-weight:400;margin:0 0 14px;color:var(--paper);display:flex;align-items:center;gap:10px;}
  .secao-titulo .emoji{font-size:24px;}

  .grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px;}
  .prato{background:var(--paper);border:2px solid var(--ink);border-radius:var(--radius);box-shadow:5px 5px 0 rgba(246,175,67,0.55);color:var(--ink);overflow:hidden;display:flex;flex-direction:column;}
  .prato .foto{position:relative;display:block;width:100%;aspect-ratio:4/3;border:0;border-bottom:2px solid var(--ink);padding:0;margin:0;background:#2a2a2a;cursor:zoom-in;overflow:hidden;}
  .prato .foto img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s ease;}
  .prato .foto:hover img{transform:scale(1.04);}
  .prato .foto:focus-visible{outline:3px solid var(--cyan);outline-offset:-3px;}
  .prato .corpo{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1;}
  .prato h3{font-family:'Titan One',cursive;font-weight:400;font-size:21px;line-height:1.15;margin:0;}
  .selos{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .tag-contem{font-family:'Poppins',sans-serif;font-weight:600;font-size:11px;color:var(--ink-soft, #5c564a);background:rgba(0,0,0,.04);border:1px solid var(--line, #e3dac1);border-radius:999px;padding:2px 9px;}
  .tag-veg{align-self:flex-start;font-family:'Poppins',sans-serif;font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:#1f6b36;background:#dff3e4;border:2px solid var(--green);border-radius:999px;padding:2px 9px;}
  .prato .desc{font-size:13.5px;line-height:1.45;color:var(--ink-soft);margin:0;}
  .precos{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:8px;align-items:center;}
  .preco{font-family:'Poppins',sans-serif;font-weight:800;font-size:17px;line-height:1.2;font-variant-numeric:tabular-nums;letter-spacing:-.01em;background:var(--orange);border:2px solid var(--ink);border-radius:8px;padding:4px 11px;white-space:nowrap;display:inline-flex;align-items:baseline;gap:3px;}
  .preco .rs{font-weight:700;font-size:.68em;letter-spacing:0;margin-right:3px;}
  .preco .tam{font-family:'Poppins',sans-serif;font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase;margin-right:4px;padding:1px 5px;border-radius:4px;background:var(--ink);color:var(--orange);align-self:center;}
  .preco-ifood{font-family:'Poppins',sans-serif;font-weight:500;font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink-soft);width:100%;}

  .tag-exclusivo{align-self:flex-start;font-family:'Poppins',sans-serif;font-weight:800;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);background:var(--orange);border:2px solid var(--ink);border-radius:999px;padding:2px 9px;}
  .prato.exclusivo{box-shadow:5px 5px 0 var(--orange);border-color:var(--orange);}
  .selo{position:absolute;top:10px;left:10px;font-family:'Poppins',sans-serif;font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;border:2px solid var(--ink);border-radius:999px;padding:4px 10px;}
  .selo-esgotado{background:var(--red);color:#fff;}
  .selo-breve{background:var(--paper);color:var(--ink-soft);top:auto;bottom:10px;left:auto;right:10px;font-size:10.5px;}
  .prato.esgotado .foto img{filter:grayscale(1) brightness(.85);}
  .prato.esgotado .preco, .preco.esgotado{background:var(--line);}
  .prato.esgotado .preco .v, .preco.esgotado .v{text-decoration:line-through;}
  .preco .esg{font-family:'Poppins',sans-serif;font-weight:800;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--red);margin-left:6px;display:inline-block;text-decoration:none;}

  .estado{text-align:center;padding:50px 10px;color:var(--paper);}
  .estado .emoji{font-size:44px;display:block;margin-bottom:8px;}
  .estado p{margin:4px 0;font-size:14px;color:#cfc7b4;}
  .btn{display:inline-block;margin-top:14px;background:var(--orange2);color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:12px 18px;font-family:'Titan One',cursive;font-size:15px;cursor:pointer;box-shadow:3px 3px 0 var(--paper);text-decoration:none;}

  /* esqueleto enquanto carrega */
  .esqueleto{background:#1c1c1c;border:2px solid #2a2a2a;border-radius:var(--radius);height:330px;animation:pulsa 1.2s ease-in-out infinite;}
  @keyframes pulsa{50%{opacity:.5;}}

  /* ---------- rodapé ---------- */
  .links{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:40px 0 0;}
  .links a{background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px;text-decoration:none;box-shadow:3px 3px 0 var(--orange2);}
  .links a.c-cyan{background:var(--cyan);}
  .links a.c-red{background:var(--red);color:#fff;}
  footer{text-align:center;padding:28px 10px 40px;font-size:12px;color:#8f887a;}
  footer .atualizado{font-family:'IBM Plex Mono',monospace;font-size:11px;display:block;margin-bottom:6px;}

  /* ---------- foto ampliada ---------- */
  .zoom{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,0.88);display:none;align-items:center;justify-content:center;padding:18px;}
  .zoom.aberto{display:flex;}
  .zoom .caixa{background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:var(--radius);box-shadow:6px 6px 0 var(--orange2);max-width:720px;width:100%;max-height:100%;overflow:auto;position:relative;}
  .zoom .caixa img{display:block;width:100%;max-height:68vh;object-fit:contain;background:#111;border-bottom:2px solid var(--ink);}
  .zoom .info{padding:14px 18px 18px;}
  .zoom .info h3{font-family:'Titan One',cursive;font-weight:400;font-size:24px;margin:0 0 6px;}
  .zoom .info p{margin:0 0 6px;font-size:14px;color:var(--ink-soft);line-height:1.45;}
  .zoom .fechar,.zoom .seta{position:absolute;z-index:2;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:50%;width:40px;height:40px;font-size:18px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 0 var(--ink);}
  .zoom .fechar{top:10px;right:10px;}
  .zoom .seta{top:calc(min(68vh, 540px) / 2 - 20px);}
  .zoom .seta.ant{left:10px;}
  .zoom .seta.prox{right:10px;}

  [hidden]{display:none !important;}
  /* ---------- tela inicial (mesma cara do menu do app) ---------- */
  .tela{padding-top:18px;}
  .home{max-width:520px;margin:0 auto;padding-top:22px;}
  .home-grid{display:flex;flex-direction:column;gap:14px;}
  .home-card{border:2px solid var(--ink);border-radius:var(--radius);padding:18px 20px;box-shadow:5px 5px 0 rgba(0,0,0,0.35);text-align:left;cursor:pointer;font-family:'Poppins',sans-serif;display:flex;align-items:center;gap:14px;width:100%;text-decoration:none;transition:transform .1s ease,box-shadow .1s ease;}
  .home-card:hover{transform:translate(1px,1px);box-shadow:3px 3px 0 rgba(0,0,0,0.35);}
  .home-card:focus-visible{outline:3px solid var(--paper);outline-offset:3px;}
  .home-card .icon{font-size:26px;flex-shrink:0;}
  .home-card .title{font-family:'Titan One',cursive;font-size:17px;flex:1;}
  .home-card .sub{display:block;font-family:'Poppins',sans-serif;font-weight:600;font-size:12px;opacity:.8;margin-top:2px;}
  .home-card.c-yellow{background:var(--orange);color:var(--ink);}
  .home-card.c-orange{background:var(--orange2);color:var(--ink);}
  .home-card.c-cyan{background:var(--cyan);color:var(--ink);}
  .home-card.c-red{background:var(--red);color:#fff;}
  .home-card.c-green{background:var(--green);color:#fff;}

  .faixa-hoje{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 18px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:var(--radius);box-shadow:5px 5px 0 var(--cyan);padding:14px 16px;text-align:left;cursor:pointer;font-family:'Poppins',sans-serif;}
  .faixa-hoje .pino{font-size:28px;flex-shrink:0;}
  .faixa-hoje .rotulo{display:block;font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#0f7f8c;}
  .faixa-hoje .onde{display:block;font-family:'Titan One',cursive;font-size:19px;line-height:1.15;margin-top:2px;}
  .faixa-hoje .quando{display:block;font-size:13px;color:var(--ink-soft);margin-top:2px;}
  .faixa-hoje .ir{font-weight:800;font-size:22px;flex-shrink:0;}

  .voltar{background:none;border:2px solid var(--paper);border-radius:8px;color:var(--paper);font-family:'Poppins',sans-serif;font-weight:600;font-size:12.5px;padding:8px 14px;cursor:pointer;margin:2px 0 6px;display:inline-flex;align-items:center;gap:6px;}
  .voltar:hover{background:var(--orange);border-color:var(--orange);color:var(--ink);}

  /* ---------- onde estamos ---------- */
  .local{background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:var(--radius);box-shadow:5px 5px 0 rgba(64,213,232,0.6);overflow:hidden;margin-top:14px;}
  .local .topo{padding:16px 18px 14px;}
  .local .rotulo{font-weight:800;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#0f7f8c;}
  .local h2{font-family:'Titan One',cursive;font-weight:400;font-size:26px;line-height:1.1;margin:4px 0 6px;}
  .local .linha{font-size:14px;color:var(--ink-soft);margin:2px 0;line-height:1.4;}
  .local .linha b{color:var(--ink);}
  .local .aviso{margin-top:10px;background:#fff6ea;border:2px solid var(--orange2);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;color:#8a5a12;}
  .mapa{display:block;width:100%;height:340px;border:0;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);background:#e9e4d6;}
  .local .acoes{display:flex;flex-wrap:wrap;gap:10px;padding:14px 18px 18px;}
  .local .acoes a{background:var(--orange);color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:11px 16px;font-family:'Titan One',cursive;font-size:15px;text-decoration:none;box-shadow:3px 3px 0 var(--ink);}
  .local .acoes a.sec{background:#fff;font-family:'Poppins',sans-serif;font-weight:700;font-size:14px;}
  .proximos{margin-top:26px;}
  .proximos h3{font-family:'Titan One',cursive;font-weight:400;font-size:20px;margin:0 0 10px;}
  .proximos ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
  .proximos li{background:#1c1c1c;border:2px solid #333;border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;}
  .proximos .dia{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;color:var(--orange);min-width:84px;text-transform:capitalize;}
  .proximos .nome{font-weight:700;font-size:14px;}
  .proximos .end{font-size:12.5px;color:#a9a294;}
  .proximos a{color:var(--cyan);font-size:12.5px;font-weight:600;margin-left:auto;white-space:nowrap;}
  .sem-evento{text-align:center;padding:34px 18px 28px;}
  .sem-evento .emoji{font-size:44px;display:block;margin-bottom:6px;}
  .sem-evento p{margin:4px 0;font-size:14px;color:var(--ink-soft);}
  /* v11: cardápio especial por evento */
  .troca-cardapio{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px;}
  .troca-cardapio .chip{box-shadow:2px 2px 0 var(--orange2);}
  .faixa-especial{margin:10px 0 0;background:#2a1f0d;border:2px solid var(--orange);color:var(--paper);border-radius:12px;padding:10px 14px;font-size:13.5px;line-height:1.45;}
  .faixa-especial b{color:var(--orange);}
  .local.especial{box-shadow:5px 5px 0 var(--orange);}
  .local .selo-especial{display:inline-block;background:var(--orange);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;}
  .especiais{margin-top:26px;}
  .especiais h3{font-family:'Titan One',cursive;font-weight:400;font-size:20px;margin:0 0 4px;color:var(--orange);}
  .aviso-demo{margin:0 0 14px;background:#2a1f0d;border:2px dashed var(--orange);color:var(--orange);border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:600;text-align:center;}

  @media (max-width:600px){
    .wrap{padding:0 30px;}
    .mapa{height:280px;}
    .local h2{font-size:23px;}
    .proximos li{flex-wrap:wrap;}
    .proximos a{margin-left:0;}
    header{padding:26px 30px 4px;}
    header .wordmark{font-size:46px;}
    .side-wave{width:22px;}
    .grade{grid-template-columns:1fr;gap:18px;}
    .secao-titulo{font-size:23px;}
    .zoom{padding:10px;}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto;}
    .prato .foto img{transition:none;}
    .esqueleto{animation:none;}
  }

  /* ---------- cardápio compacto no celular: foto ao lado do texto ---------- */
  @media (max-width:600px){
    .grade{gap:12px;}
    .prato{flex-direction:row;align-items:stretch;box-shadow:4px 4px 0 rgba(246,175,67,0.55);}
    .prato .foto{width:118px;flex:0 0 118px;aspect-ratio:auto;min-height:118px;border-bottom:0;border-right:2px solid var(--ink);}
    .prato .corpo{padding:11px 12px 12px;gap:5px;min-width:0;}
    .prato h3{font-size:18px;}
    .prato .desc{font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
    .selo{top:6px;left:6px;font-size:10px;padding:2px 7px;}
    .selo-breve{display:none;}
    .precos{padding-top:4px;}
    .preco{font-size:16px;padding:3px 9px;}
  }

  /* ---------- food truck animado da tela inicial (figures/foodtruck.js) ---------- */
  .truck{margin:0 auto 10px;max-width:340px;
    --hairline-plate:var(--paper);--hairline-edge:var(--ink);--hairline-mid:var(--ink);--hairline-lo:rgba(24,24,24,.5);--hairline-hi:var(--orange);--hairline-stroke:1.7;}
  /* cores do truck de verdade: cabine branca, baú preto pintado com arcos, rodas de aro amarelo */
  .truck .t-chao path:not(.nf){fill:#2b2723;stroke:#5c564a;}
  .truck .t-corpo path:not(.nf){fill:#161616;stroke:#8d8676;}
  .truck .t-corpo path.nf{stroke:#3a3732;}
  .truck .t-teto path:not(.nf){fill:#2a2a2a;stroke:#8d8676;}
  .truck .t-cabine path:not(.nf){fill:#f4f1ea;}
  .truck .t-cabine path.vidro{fill:#2d3940;}
  .truck path.emblema{stroke:none;} .truck .t-cabine path.e0{fill:var(--red);} .truck .t-cabine path.e1{fill:var(--orange);}
  .truck .arco{stroke:none;} .truck .a0{fill:var(--cyan);} .truck .a1{fill:var(--red);} .truck .a2{fill:var(--orange);} .truck .a3{fill:#161616;}
  .truck .moldura{fill:#161616;stroke:#c9c6bd;}
  .truck .dentro{fill:#2d3940;stroke:#c9c6bd;}
  .truck .t-balcao path:not(.nf){fill:#c9c6bd;}
  .truck .dot.prato{stroke:var(--ink);stroke-width:1;}
  .truck .dot.p0{fill:var(--orange);} .truck .dot.p1{fill:var(--green);} .truck .dot.p2{fill:#fff;}
  .truck .pneu{fill:var(--ink);stroke:#5c564a;} .truck .aro{fill:#f2c230;} .truck .cubo{fill:var(--red);}
  .truck .t-toldo .listra{display:none;}
  .truck .t-toldo path.sil{fill:#161616;stroke:#c9c6bd;} .truck .t-toldo path.sil.hi{stroke:var(--orange);}
  .truck .t-toldo path.lo:not(.nf){fill:#3a3732;}
  .truck .t-toldo path.nf{stroke:#c9c6bd;}
  .truck-read{text-align:center;font-family:'Poppins',sans-serif;font-weight:700;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--orange);margin-top:-14px;}

  /* ---------- bebidas em lista, topo compacto no cardápio e acabamentos ---------- */
  /* ponto 3: bebidas em lista */
  .lista-bebidas{list-style:none;margin:0;padding:4px 16px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:var(--radius);box-shadow:4px 4px 0 rgba(246,175,67,0.55);}
  .bebida{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1.5px dashed var(--line);}
  .bebida:last-child{border-bottom:0;}
  .bebida .mini{flex:0 0 44px;height:44px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;padding:0;cursor:zoom-in;background:#2a2a2a;}
  .bebida .mini img{width:100%;height:100%;object-fit:cover;display:block;}
  .bebida .nome{flex:1;min-width:0;font-family:'Titan One',cursive;font-size:17px;line-height:1.2;}
  .bebida .precos{margin:0;padding:0;flex:0 0 auto;}
  .bebida.esgotado .nome{color:var(--ink-soft);}

// ---------------------------------------------------------------------------
// utilidades
// ---------------------------------------------------------------------------
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function normalizar(s){
  return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
}
function reais(v){
  const n = Number(v);
  if (!isFinite(n) || n <= 0) return '';
  return 'R$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 });
}
function slug(s){
  return normalizar(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'outros';
}

const CHAVE_CACHE = 'cardapio:cache';
function lerCache(){
  try { return JSON.parse(localStorage.getItem(CHAVE_CACHE) || 'null'); } catch (e) { return null; }
}
function gravarCache(dados){
  try { localStorage.setItem(CHAVE_CACHE, JSON.stringify(dados)); } catch (e) {}
}

// Converte o que estiver no campo Foto num endereço de imagem seguro.
// Selos do prato. Com o Apps Script v10 vêm as caixinhas da aba Menu
// (Contém ovo / leite / carne; carne inclui frango, porco, peixe e frutos do
// mar): sem carne = vegetariano, sem carne, ovo e leite = vegano. Bebidas não
// ganham selo. Sem as caixinhas (Apps Script antigo), vale o 🌱 Vegetariano antigo.
function seloVerde(p){
  if (!p.temCaixinhas) return p.vegetariano ? 'Vegetariano' : '';
  if (normalizar(p.categoria) === 'bebidas' || p.carne) return '';
  return p.ovo || p.leite ? 'Vegetariano' : 'Vegano';
}
let TEXTO_EXCLUSIVO = '⭐ Só no dia do evento';
function htmlSelos(p){
  const verde = seloVerde(p);
  const contem = p.temCaixinhas && normalizar(p.categoria) !== 'bebidas'
    ? [p.ovo && '🥚 Ovo', p.leite && '🥛 Leite', p.carne && '🍖 Carne'].filter(Boolean) : [];
  if (!verde && !contem.length && !p.exclusivo) return '';
  return `<div class="selos">${p.exclusivo ? `<span class="tag-exclusivo">${esc(TEXTO_EXCLUSIVO)}</span>` : ''}${verde ? `<span class="tag-veg">🌱 ${verde}</span>` : ''}${contem.length ? `<span class="tag-contem">Contém ${contem.join(' · ')}</span>` : ''}</div>`;
}
function urlFoto(valor){
  const v = String(valor || '').trim();
  if (!v) return '';
  const drive = v.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{10,})/);
  if (drive) return 'https://drive.google.com/thumbnail?id=' + drive[1] + '&sz=w1200';
  if (/^https?:\/\//i.test(v)) return v;
  if (/^[\w./ -]+$/.test(v) && !v.includes('..')) return PASTA_FOTOS + v.replace(/^\/+/, '');
  return '';
}

// Foto provisória: um cartão com o emoji do prato, nas cores do Narua.
const CORES_PROVISORIAS = ['#f6af43', '#f49140', '#40d5e8', '#e73334'];
function fotoProvisoria(nome, indice){
  const n = normalizar(nome);
  const achado = EMOJI_PRATO.find(([k]) => n.includes(k));
  const emoji = achado ? achado[1] : '🍱';
  const cor = CORES_PROVISORIAS[indice % CORES_PROVISORIAS.length];
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 300'>` +
    `<rect width='400' height='300' fill='${cor}'/>` +
    `<g fill='none' stroke='#181818' stroke-opacity='.12' stroke-width='10'>` +
    `<circle cx='0' cy='300' r='90'/><circle cx='0' cy='300' r='130'/><circle cx='400' cy='0' r='90'/><circle cx='400' cy='0' r='130'/></g>` +
    `<text x='200' y='150' font-size='130' text-anchor='middle' dominant-baseline='central'>${emoji}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

// ---------------------------------------------------------------------------
// dados
// ---------------------------------------------------------------------------

// Junta linhas com o mesmo nome (ex.: Yakissoba P e G) num cartão só e
// separa por categoria. Itens com status "oculto" não aparecem.
function montarCategorias(itens){
  const porCategoria = new Map();
  const porNome = new Map();
  // Enquanto nenhuma caixinha estiver marcada na aba Menu (valores ainda em
  // validação), vale o 🌱 Vegetariano antigo, pra não mostrar "Vegano" em tudo.
  const caixinhasPreenchidas = (itens || []).some(it => it.contem_ovo === true || it.contem_leite === true || it.contem_carne === true);
  (itens || []).forEach(it => {
    const nome = String(it.nome || '').trim();
    if (!nome) return;
    const status = normalizar(it.status || 'disponivel');
    if (status === 'oculto') return;
    const categoria = String(it.categoria || '').trim() || 'Outros';
    const grupo = it.exclusivo === true ? CAT_EXCLUSIVOS : categoria;
    const chave = normalizar(grupo) + '|' + normalizar(nome);
    let prato = porNome.get(chave);
    if (!prato) {
      prato = { nome, categoria, exclusivo: it.exclusivo === true, descricao: '', foto: '', vegetariano: false, variantes: [], esgotados: 0,
        temCaixinhas: false, ovo: false, leite: false, carne: false };
      porNome.set(chave, prato);
      if (!porCategoria.has(grupo)) porCategoria.set(grupo, []);
      porCategoria.get(grupo).push(prato);
    }
    if (!prato.descricao && it.descricao) prato.descricao = String(it.descricao);
    if (!prato.foto && it.foto) prato.foto = urlFoto(it.foto);
    if (it.vegetariano === true) prato.vegetariano = true;
    // Apps Script v10: caixinhas Contém ovo / leite / carne no lugar do Vegetariano.
    if (caixinhasPreenchidas && ('contem_carne' in it || 'contem_ovo' in it || 'contem_leite' in it)) {
      prato.temCaixinhas = true;
      if (it.contem_ovo === true) prato.ovo = true;
      if (it.contem_leite === true) prato.leite = true;
      if (it.contem_carne === true) prato.carne = true;
    }
    const esgotado = status === 'esgotado';
    if (esgotado) prato.esgotados++;
    prato.variantes.push({ tamanho: String(it.tamanho || '').trim(), preco: Number(it.preco) || 0, preco_ifood: Number(it.preco_ifood) || 0, esgotado });
  });
  porNome.forEach(p => { p.esgotado = p.esgotados > 0 && p.esgotados === p.variantes.length; });

  const ordem = ORDEM_CATEGORIAS.map(normalizar);
  return [...porCategoria.entries()]
    .map(([nome, pratos], i) => ({ nome, pratos, pos: ordem.indexOf(normalizar(nome)) < 0 ? 100 + i : ordem.indexOf(normalizar(nome)) }))
    .sort((a, b) => a.pos - b.pos);
}

async function buscarCardapio(){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 15000);
  try {
    const resp = await fetch(URL_CARDAPIO + (URL_CARDAPIO.includes('?') ? '&' : '?') + 'action=cardapio', { cache: 'no-store', signal: ctrl.signal });
    const dados = await resp.json();
    if (!dados || dados.ok !== true || !Array.isArray(dados.itens)) throw new Error('resposta inesperada');
    return dados;
  } finally {
    clearTimeout(timer);
  }
}

let PRATOS_COM_ZOOM = [];

function htmlPrecos(prato){
  const varias = prato.variantes.length > 1;
  let html = prato.variantes.map(v => {
    const valor = reais(v.preco);
    if (!valor) return '';
    const tam = varias && v.tamanho ? `<span class="tam">${esc(v.tamanho)}</span>` : '';
    // Um tamanho esgotado (ex.: só o P) fica riscado com "esgotado"; o cartão
    // inteiro só vira Esgotado quando todos os tamanhos esgotam.
    const esgotadoSo = v.esgotado && !prato.esgotado;
    return `<span class="preco${esgotadoSo ? ' esgotado' : ''}"${v.esgotado ? ' title="Esgotado"' : ''}>${tam}<span class="v">${valor.replace('R$ ', '<span class="rs">R$</span>')}</span>${esgotadoSo ? '<span class="esg">esgotado</span>' : ''}</span>`;
  }).join('');
  if (MOSTRAR_PRECO_IFOOD) {
    const ifood = prato.variantes.map(v => {
      const valor = reais(v.preco_ifood);
      return valor ? (varias && v.tamanho ? v.tamanho + ' ' : '') + valor : '';
    }).filter(Boolean);
    if (ifood.length) html += `<span class="preco-ifood">No iFood: ${esc(ifood.join(' · '))}</span>`;
  }
  return html;
}

// v11: cardápio especial por evento. dados.especiais = [{nome, eventos:[{data,
// local, evento}], itens}]: a planilha manda os cardápios dos eventos da
// agenda de hoje em diante (Apps Script v13; até a v12, só os de hoje). O
// cliente pode ver o "Menu do evento X" antes do dia pelo botão "Conferir
// menu"; no dia, a tela Cardápio já abre nele, com um botão para o de sempre.
// O link #cardapio/<nome> abre um cardápio específico.
let DADOS_CARDAPIO = null;
function especiaisDe(dados){
  return (dados && Array.isArray(dados.especiais) ? dados.especiais : []).filter(c => c && c.nome && Array.isArray(c.itens) && c.itens.length);
}
function cardapioPedido(){
  const m = location.hash.match(/^#cardapio\/(.+)$/);
  return m ? decodeURIComponent(m[1]) : '';
}
function especialDeHoje(dados){
  const hoje = agoraSP().data;
  return especiaisDe(dados).find(c => (c.eventos || []).some(ev => ev.data === hoje)) || null;
}
function escolherCardapio(dados){
  const pedido = cardapioPedido();
  // No dia do evento o site só mostra o cardápio do evento (pedido do Brenno,
  // 20/10): o "Cardápio de sempre" some e o link #cardapio/normal cai nele.
  if (pedido === 'normal') return especialDeHoje(dados);
  if (pedido) {
    const achado = especiaisDe(dados).find(c => slug(c.nome) === slug(pedido));
    if (achado) return achado;
  }
  return especialDeHoje(dados);
}
function dataCurta(d){
  const m = String(d || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? m[3] + '/' + m[2] : '';
}
function tituloEspecial(c){
  const nomes = [];
  (c.eventos || []).forEach(ev => { const n = maiuscula(ev.evento || ev.local || ''); if (n && !nomes.some(x => normalizar(x) === normalizar(n))) nomes.push(n); });
  return 'Menu do evento ' + (nomes.join(' / ') || c.nome);
}
function quandoEspecial(c){
  const hoje = agoraSP().data;
  return (c.eventos || []).map(ev => diaPorExtenso(ev.data, hoje) + (ev.local ? ' · ' + ev.local : '')).join(', ');
}
function renderTroca(dados, escolhido){
  const caixa = document.getElementById('trocaCardapio');
  const lista = especiaisDe(dados);
  if (!lista.length) { caixa.hidden = true; caixa.innerHTML = ''; return; }
  const deHoje = especialDeHoje(dados);
  const chips = (deHoje ? [] : [`<button class="chip${escolhido ? '' : ' ativo'}" type="button" data-cardapio="normal">🍜 Cardápio de sempre</button>`])
    .concat(lista.map(c => `<button class="chip${escolhido === c ? ' ativo' : ''}" type="button" data-cardapio="${esc(slug(c.nome))}">⭐ ${esc(tituloEspecial(c))}</button>`));
  caixa.hidden = false;
  const hojeEsc = escolhido && escolhido === deHoje;
  const temExclusivo = escolhido && escolhido.itens.some(it => it.exclusivo === true);
  caixa.innerHTML = (chips.length > 1 ? `<div class="troca-cardapio">${chips.join('')}</div>` : '') +
    (escolhido ? `<div class="faixa-especial">⭐ <b>${esc(tituloEspecial(escolhido))}</b><br>` +
      (hojeEsc ? `Hoje vale este cardápio${temExclusivo ? ', com itens que só existem no evento' : ''}.`
        : `Vale ${esc(quandoEspecial(escolhido))}.${temExclusivo ? ' Os itens marcados ⭐ só existem no dia do evento.' : ''} Até lá, vale o cardápio de sempre.`) + `</div>` : '');
  caixa.querySelectorAll('[data-cardapio]').forEach(b => b.addEventListener('click', () => irPara('cardapio/' + b.dataset.cardapio)));
}

function render(dados){
  DADOS_CARDAPIO = dados;
  const escolhido = escolherCardapio(dados);
  renderTroca(dados, escolhido);
  // o botão "Conferir menu" do Onde estamos depende do cardápio já carregado
  if (ULTIMA_AGENDA) renderAgenda(ULTIMA_AGENDA);
  TEXTO_EXCLUSIVO = escolhido && escolhido === especialDeHoje(dados) ? '⭐ Só hoje, no evento'
    : '⭐ Só no dia do evento' + (escolhido && escolhido.eventos && escolhido.eventos[0] ? ' (' + dataCurta(escolhido.eventos[0].data) + ')' : '');
  const categorias = montarCategorias(escolhido ? escolhido.itens : dados.itens);
  const main = document.getElementById('conteudo');
  document.getElementById('avisoExemplo').hidden = !dados.exemplo;

  if (!categorias.length) {
    main.innerHTML = `<div class="estado"><span class="emoji">🍜</span><p>O cardápio está sendo preparado. Volte daqui a pouco!</p></div>`;
    document.getElementById('catNav').hidden = true;
    return;
  }

  PRATOS_COM_ZOOM = [];
  let indice = 0;
  main.innerHTML = categorias.map(cat => {
    const emoji = EMOJI_CATEGORIA[normalizar(cat.nome)] || '🍱';
    // bebidas: lista simples (nome e preço); a foto, quando existe, vira miniatura
    if (normalizar(cat.nome) === 'bebidas') {
      const linhas = cat.pratos.map(p => {
        const i = indice++;
        p.src = p.foto || fotoProvisoria(p.nome, i);
        p.provisoria = !p.foto;
        p.zoomIdx = PRATOS_COM_ZOOM.push(p) - 1;
        return `
          <li class="bebida${p.esgotado ? ' esgotado' : ''}">
            ${p.foto ? `<button class="mini" type="button" data-zoom="${p.zoomIdx}" aria-label="Ver foto de ${esc(p.nome)}"><img src="${esc(p.src)}" alt="" loading="lazy" decoding="async"></button>` : ''}
            <span class="nome">${esc(p.nome)}${p.esgotado ? '<span class="esg-tag">esgotado</span>' : ''}</span>
            <span class="precos">${htmlPrecos(p)}</span>
          </li>`;
      }).join('');
      return `
      <section class="secao" id="cat-${slug(cat.nome)}" data-cat="${esc(cat.nome)}">
        <h2 class="secao-titulo"><span class="emoji">${emoji}</span>${esc(cat.nome)}</h2>
        <ul class="lista-bebidas">${linhas}</ul>
      </section>`;
    }
    const cartoes = cat.pratos.map(p => {
      const i = indice++;
      const provisoria = !p.foto;
      p.src = p.foto || fotoProvisoria(p.nome, i);
      p.provisoria = provisoria;
      p.zoomIdx = PRATOS_COM_ZOOM.push(p) - 1;
      return `
        <article class="prato${p.esgotado ? ' esgotado' : ''}${p.exclusivo ? ' exclusivo' : ''}">
          <button class="foto" type="button" data-zoom="${p.zoomIdx}" aria-label="Ver foto de ${esc(p.nome)}">
            <img src="${esc(p.src)}" alt="${esc(p.nome)}" loading="lazy" decoding="async" data-prov="${esc(fotoProvisoria(p.nome, i))}">
            ${p.esgotado ? '<span class="selo selo-esgotado">Esgotado</span>' : ''}
            ${provisoria ? '<span class="selo selo-breve">📷 foto em breve</span>' : ''}
          </button>
          <div class="corpo">
            <h3>${esc(p.nome)}</h3>
            ${htmlSelos(p)}
            ${p.descricao ? `<p class="desc">${esc(p.descricao)}</p>` : ''}
            <div class="precos">${htmlPrecos(p)}</div>
          </div>
        </article>`;
    }).join('');
    return `
      <section class="secao" id="cat-${slug(cat.nome)}" data-cat="${esc(cat.nome)}">
        <h2 class="secao-titulo"><span class="emoji">${emoji}</span>${esc(cat.nome)}</h2>
        <div class="grade">${cartoes}</div>
      </section>`;
  }).join('');

  // Se a foto real não carregar, cai para a provisória.
  main.querySelectorAll('img[data-prov]').forEach(img => {
    img.addEventListener('error', () => {
      if (img.src !== img.dataset.prov) img.src = img.dataset.prov;
    }, { once: true });
  });

  renderNav(categorias);
}

function renderNav(categorias){
  const nav = document.getElementById('catNav');
  const lista = document.getElementById('catLista');
  nav.hidden = categorias.length < 2;
  lista.innerHTML = categorias.map(c =>
    `<button class="chip" type="button" data-alvo="cat-${slug(c.nome)}">${EMOJI_CATEGORIA[normalizar(c.nome)] || '🍱'} ${esc(c.nome)}</button>`
  ).join('');
  lista.querySelectorAll('.chip').forEach(chip => chip.addEventListener('click', () => {
    document.getElementById(chip.dataset.alvo).scrollIntoView();
  }));

  if (!('IntersectionObserver' in window)) return;
  if (window._obsCat) window._obsCat.disconnect();
  const marcar = id => lista.querySelectorAll('.chip').forEach(ch => {
    const ativo = ch.dataset.alvo === id;
    ch.classList.toggle('ativo', ativo);
    if (ativo) ch.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  });
  window._obsCat = new IntersectionObserver(entradas => {
    entradas.forEach(e => { if (e.isIntersecting) marcar(e.target.id); });
  }, { rootMargin: '-30% 0px -60% 0px' });
  document.querySelectorAll('.secao').forEach(s => window._obsCat.observe(s));
  marcar('cat-' + slug(categorias[0].nome));
}

function renderLinks(){
  const cartoes = [];
  if (LINKS.instagram) cartoes.push(`<a class="home-card c-red" href="${esc(LINKS.instagram)}" target="_blank" rel="noopener"><span class="icon">📸</span><span class="title">Instagram<span class="sub">@narua.foodtruck</span></span></a>`);
  if (LINKS.whatsapp) cartoes.push(`<a class="home-card c-green" href="${esc(LINKS.whatsapp)}" target="_blank" rel="noopener"><span class="icon">💬</span><span class="title">WhatsApp<span class="sub">Fale com a gente · (11) 94328-3434</span></span></a>`);
  if (LINKS.ifood) cartoes.push(`<a class="home-card c-orange" href="${esc(LINKS.ifood)}" target="_blank" rel="noopener"><span class="icon">🛵</span><span class="title">Peça no iFood</span></a>`);
  const grade = document.getElementById('homeGrid');
  grade.querySelectorAll('a.home-card').forEach(a => a.remove());
  grade.insertAdjacentHTML('beforeend', cartoes.join(''));

  const botoes = [];

  if (LINKS.whatsapp) botoes.push(`<a class="c-cyan" href="${esc(LINKS.whatsapp)}" target="_blank" rel="noopener">💬 WhatsApp</a>`);
  if (LINKS.ifood) botoes.push(`<a class="c-red" href="${esc(LINKS.ifood)}" target="_blank" rel="noopener">🛵 Peça no iFood</a>`);
  document.getElementById('links').innerHTML = botoes.join('');
}

// ---------------------------------------------------------------------------
// foto ampliada
// ---------------------------------------------------------------------------
let zoomAtual = -1;
const zoom = document.getElementById('zoom');
let focoAntes = null;

function abrirZoom(i){
  const p = PRATOS_COM_ZOOM[i];
  if (!p) return;
  if (zoomAtual < 0) focoAntes = document.activeElement;
  zoomAtual = i;
  const img = document.getElementById('zoomImg');
  img.onerror = () => { img.onerror = null; img.src = fotoProvisoria(p.nome, i); };
  img.src = p.src;
  img.alt = p.nome;
  document.getElementById('zoomNome').textContent = p.nome + (seloVerde(p) ? ' 🌱' : '') + (p.esgotado ? ' · esgotado' : '');
  const desc = document.getElementById('zoomDesc');
  desc.textContent = p.descricao || '';
  desc.hidden = !p.descricao;
  document.getElementById('zoomPrecos').innerHTML = htmlPrecos(p);
  const varios = PRATOS_COM_ZOOM.length > 1;
  document.getElementById('zoomAnt').hidden = !varios;
  document.getElementById('zoomProx').hidden = !varios;
  zoom.classList.add('aberto');
  document.body.style.overflow = 'hidden';
  document.getElementById('zoomFechar').focus();
}
function fecharZoom(){
  zoom.classList.remove('aberto');
  document.body.style.overflow = '';
  zoomAtual = -1;
  if (focoAntes) focoAntes.focus();
}
function passarZoom(delta){
  const n = PRATOS_COM_ZOOM.length;
  abrirZoom((zoomAtual + delta + n) % n);
}

document.getElementById('conteudo').addEventListener('click', e => {
  const alvo = e.target.closest('[data-zoom]');
  if (alvo) abrirZoom(Number(alvo.dataset.zoom));
});
document.getElementById('zoomFechar').addEventListener('click', fecharZoom);
document.getElementById('zoomAnt').addEventListener('click', () => passarZoom(-1));
document.getElementById('zoomProx').addEventListener('click', () => passarZoom(1));
zoom.addEventListener('click', e => { if (e.target === zoom) fecharZoom(); });
document.addEventListener('keydown', e => {
  if (zoomAtual < 0) return;
  if (e.key === 'Escape') fecharZoom();
  else if (e.key === 'ArrowLeft') passarZoom(-1);
  else if (e.key === 'ArrowRight') passarZoom(1);
});
// arrastar para o lado no celular troca de foto
let toqueX = null;
zoom.addEventListener('touchstart', e => { toqueX = e.touches[0].clientX; }, { passive: true });
zoom.addEventListener('touchend', e => {
  if (toqueX == null) return;
  const dx = e.changedTouches[0].clientX - toqueX;
  toqueX = null;
  if (Math.abs(dx) > 60) passarZoom(dx < 0 ? 1 : -1);
});

// ---------------------------------------------------------------------------
// telas: início, cardápio e onde estamos. O endereço guarda a tela
// (#cardapio, #onde-estamos), então o botão voltar do celular funciona e dá
// para mandar o link direto, ex.: naruafoodtruck.com.br/#onde-estamos
// ---------------------------------------------------------------------------
const TELAS = { '': 'telaInicio', 'cardapio': 'telaCardapio', 'onde-estamos': 'telaOnde' };
const TITULOS = { '': 'Narua · Comida asiática de rua', 'cardapio': 'Narua · Cardápio', 'onde-estamos': 'Narua · Onde estamos' };

function mostrarTela(){
  let nome = location.hash.replace(/^#/, '');
  if (/^cardapio(\/|$)/.test(nome)) {
    nome = 'cardapio';
    if (DADOS_CARDAPIO && zoomAtual < 0) render(DADOS_CARDAPIO);
  }
  if (!(nome in TELAS)) nome = '';
  Object.entries(TELAS).forEach(([k, id]) => { document.getElementById(id).hidden = k !== nome; });
  document.title = TITULOS[nome];
  document.body.dataset.tela = nome || 'inicio';
  if (nome === 'cardapio' && window._obsCat) {
    // recalcula o chip ativo agora que a tela está visível
    document.querySelectorAll('.secao').forEach(s => { window._obsCat.unobserve(s); window._obsCat.observe(s); });
  }
  window.scrollTo(0, 0);
}
function irPara(nome){
  if (location.hash.replace(/^#/, '') === nome) { mostrarTela(); return; }
  if (nome) location.hash = nome;
  else history.pushState('', document.title, location.pathname + location.search);
  mostrarTela();
}
window.addEventListener('hashchange', mostrarTela);
window.addEventListener('popstate', mostrarTela);
document.addEventListener('click', e => {
  const alvo = e.target.closest('[data-ir]');
  if (alvo) irPara(alvo.dataset.ir);
});

// ---------------------------------------------------------------------------
// agenda (onde estamos)
// ---------------------------------------------------------------------------

// Data e hora de agora no fuso de São Paulo, como texto: '2026-10-19', '14:05'.
function agoraSP(){
  const p = {};
  new Intl.DateTimeFormat('en-CA', { timeZone: FUSO, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
    .formatToParts(new Date()).forEach(x => { p[x.type] = x.value; });
  return { data: `${p.year}-${p.month}-${p.day}`, hora: `${p.hour}:${p.minute}` };
}
function somarDias(data, n){
  const d = new Date(data + 'T12:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
function hora(h){
  const m = String(h || '').match(/^(\d{1,2}):(\d{2})/);
  if (!m) return '';
  return m[2] === '00' ? Number(m[1]) + 'h' : Number(m[1]) + 'h' + m[2];
}
function horario(ev){
  const i = hora(ev.inicio), f = hora(ev.fim);
  if (i && f) return `das ${i} às ${f}`;
  if (i) return `a partir das ${i}`;
  return '';
}
function diaPorExtenso(data, hoje){
  if (data === hoje) return 'hoje';
  if (data === somarDias(hoje, 1)) return 'amanhã';
  const d = new Date(data + 'T12:00:00Z');
  return d.toLocaleDateString('pt-BR', { timeZone: 'UTC', weekday: 'long', day: '2-digit', month: '2-digit' }).replace('-feira', '');
}
// Ponto do mapa: coordenadas se houver, senão o endereço, senão o nome do local.
function pontoMapa(ev){
  const lat = Number(ev.lat), lng = Number(ev.lng);
  if (isFinite(lat) && isFinite(lng) && (lat || lng)) return lat + ',' + lng;
  return [ev.endereco, ev.local].filter(Boolean).join(', ') || ev.evento || '';
}
const urlMapa = ev => 'https://maps.google.com/maps?q=' + encodeURIComponent(pontoMapa(ev)) + '&z=16&hl=pt-BR&output=embed';
const urlComoChegar = ev => 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(pontoMapa(ev));
const urlAbrirMapa = ev => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(pontoMapa(ev));

// Separa a agenda em: evento de hoje ainda aberto, próximo evento e os demais.
function maiuscula(s){
  s = String(s || '').trim();
  return s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
}
function organizarAgenda(dados){
  const agora = agoraSP();
  const eventos = (dados && Array.isArray(dados.eventos) ? dados.eventos : [])
    .map(ev => ev ? Object.assign({}, ev, { evento: maiuscula(ev.evento), local: maiuscula(ev.local) }) : ev)
    .filter(ev => ev && /^\d{4}-\d{2}-\d{2}$/.test(String(ev.data || '')) && (ev.local || ev.evento))
    .filter(ev => ev.data > agora.data || (ev.data === agora.data && !(ev.fim && hora(ev.fim) && String(ev.fim).slice(0, 5) <= agora.hora)))
    .sort((a, b) => (a.data + (a.inicio || '')).localeCompare(b.data + (b.inicio || '')));
  // Dois eventos no mesmo dia: o especial vem primeiro.
  const hoje = eventos.find(ev => ev.data === agora.data && ev.especial) || eventos.find(ev => ev.data === agora.data) || null;
  const resto = eventos.filter(ev => ev !== hoje);
  const proximo = hoje ? null : (resto[0] || null);
  // Eventos especiais aparecem TODOS, numa seção própria (fora do limite dos
  // próximos eventos); a lista "Próximos eventos" fica só com os comuns.
  const especiais = resto.filter(ev => ev.especial && ev !== proximo);
  const comuns = resto.filter(ev => !ev.especial && ev !== proximo);
  return { hojeData: agora.data, hoje, proximo, especiais, seguintes: comuns.slice(0, MAX_PROXIMOS) };
}

// Botão "Conferir menu": aparece em qualquer dia, mas só se o cardápio do
// evento já está cadastrado na aba "Cardápios especiais" (a planilha só manda
// os cardápios que existem e estão ligados a um evento da agenda).
function temMenuDoEvento(ev){
  if (!ev.cardapio) return false;
  return especiaisDe(DADOS_CARDAPIO).some(c => slug(c.nome) === slug(ev.cardapio) && (c.eventos || []).some(e => e.data === ev.data));
}

function htmlLocal(ev, rotulo, hoje){
  const nome = ev.evento && ev.local && normalizar(ev.evento) !== normalizar(ev.local) ? `${ev.evento}` : (ev.evento || ev.local);
  const sub = ev.evento && ev.local && normalizar(ev.evento) !== normalizar(ev.local) ? ev.local : '';
  const quando = (ev.data === hoje ? 'Hoje' : diaPorExtenso(ev.data, hoje).replace(/^./, c => c.toUpperCase())) + (horario(ev) ? ', ' + horario(ev) : '');
  const cardapio = temMenuDoEvento(ev) ? `<a href="#cardapio/${esc(encodeURIComponent(slug(ev.cardapio)))}">📋 Conferir menu</a>` : '';
  return `
    <article class="local${ev.especial ? ' especial' : ''}">
      <div class="topo">
        ${ev.especial ? '<span class="selo-especial">⭐ Evento especial</span>' : ''}
        <div class="rotulo">${esc(rotulo)}</div>
        <h2>${esc(nome)}</h2>
        ${sub ? `<p class="linha"><b>${esc(sub)}</b></p>` : ''}
        <p class="linha">🕒 ${esc(quando)}</p>
        ${ev.endereco ? `<p class="linha">📍 ${esc(ev.endereco)}</p>` : ''}
        ${ev.aviso ? `<div class="aviso">${esc(ev.aviso)}</div>` : ''}
      </div>
      <iframe class="mapa" src="${esc(urlMapa(ev))}" title="Mapa: ${esc(nome)}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
      <div class="acoes">
        ${cardapio}
        <a href="${esc(urlComoChegar(ev))}" target="_blank" rel="noopener">🧭 Como chegar</a>
        <a class="sec" href="${esc(urlAbrirMapa(ev))}" target="_blank" rel="noopener">Abrir no Google Maps</a>
      </div>
    </article>`;
}

let ULTIMA_AGENDA = null;
function renderAgenda(dados){
  ULTIMA_AGENDA = dados;
  const faixa = document.getElementById('faixaHoje');
  const caixa = document.getElementById('ondeConteudo');
  const sub = document.getElementById('homeOndeSub');
  const insta = LINKS.instagram ? `<a class="btn" href="${esc(LINKS.instagram)}" target="_blank" rel="noopener">📸 Ver no Instagram</a>` : '';

  if (!dados) {
    faixa.hidden = true;
    sub.textContent = 'Onde o food truck está hoje';
    caixa.innerHTML = `<article class="local"><div class="sem-evento"><span class="emoji">📍</span><p>Não conseguimos carregar a agenda agora.</p><p>A programação também sai no nosso Instagram.</p>${insta}</div></article>`;
    return;
  }

  const ag = organizarAgenda(dados);
  if (ag.hoje) {
    faixa.hidden = false;
    document.getElementById('faixaOnde').textContent = ag.hoje.local || ag.hoje.evento;
    document.getElementById('faixaQuando').textContent = [ag.hoje.evento && ag.hoje.evento !== ag.hoje.local ? ag.hoje.evento : '', horario(ag.hoje)].filter(Boolean).join(' · ');
    sub.textContent = 'Hoje: ' + (ag.hoje.local || ag.hoje.evento);
  } else {
    faixa.hidden = true;
    if (!ag.proximo && ag.especiais.length) sub.textContent = '⭐ Evento especial: ' + diaPorExtenso(ag.especiais[0].data, ag.hojeData);
    else sub.textContent = ag.proximo ? 'Próximo: ' + diaPorExtenso(ag.proximo.data, ag.hojeData) + ', ' + (ag.proximo.local || ag.proximo.evento) : 'Agenda e localização';
  }

  let html = '';
  if (ag.hoje) html += htmlLocal(ag.hoje, 'Hoje estamos em', ag.hojeData);
  else if (ag.proximo) html += `<p class="linha" style="margin:10px 0 0;color:#cfc7b4;font-size:14px;">Hoje o food truck não está na rua. Nosso próximo evento:</p>` + htmlLocal(ag.proximo, 'Próximo evento', ag.hojeData);
  else html += `<article class="local"><div class="sem-evento"><span class="emoji">🚚</span><p><b>Hoje o food truck não está na rua.</b></p><p>Os próximos eventos saem aqui e no nosso Instagram.</p>${insta}</div></article>`;

  if (ag.especiais.length) {
    html += `<section class="especiais"><h3>⭐ Eventos especiais</h3>` +
      ag.especiais.map(ev => htmlLocal(ev, diaPorExtenso(ev.data, ag.hojeData).replace(/^./, c => c.toUpperCase()), ag.hojeData)).join('') +
      `</section>`;
  }
  if (ag.seguintes.length) {
    html += `<section class="proximos"><h3>Próximos eventos</h3><ul>` + ag.seguintes.map(ev => `
      <li>
        <span class="dia">${esc(diaPorExtenso(ev.data, ag.hojeData))}</span>
        <span><span class="nome">${esc(ev.evento || ev.local)}${ev.evento && ev.local && ev.evento !== ev.local ? ' · ' + esc(ev.local) : ''}</span><br><span class="end">${esc([horario(ev), ev.endereco].filter(Boolean).join(' · '))}</span></span>
        <a href="${esc(urlAbrirMapa(ev))}" target="_blank" rel="noopener">Ver no mapa ›</a>
      </li>`).join('') + `</ul></section>`;
  }
  caixa.innerHTML = html;
}

// Agenda de exemplo para testar sem a planilha (?demo=semana|hoje|nada).
// "semana" usa a agenda fixa real (quinta em Caieiras, sábado na 7 de
// setembro), repetida toda semana como a planilha vai fazer; "hoje" finge que
// hoje é dia de 7 de setembro.
const AGENDA_FIXA_DEMO = [
  { dia_semana: 4, evento: '', local: 'Nova Caieiras', endereco: 'Ver. Bento Rodrigues, Nova Caieiras, Caieiras - SP, 07700-000' },
  { dia_semana: 6, evento: '', local: '7 de setembro', endereco: 'Av. Sete de Setembro, 45, Franco da Rocha - SP' }
];
function agendaDemo(tipo){
  const hoje = agoraSP().data;
  if (tipo === 'nada') return { ok: true, eventos: [] };
  const eventos = [];
  for (let n = 0; n < 21; n++) {
    const data = somarDias(hoje, n);
    const dia = new Date(data + 'T12:00:00Z').getUTCDay();
    AGENDA_FIXA_DEMO.filter(f => f.dia_semana === dia).forEach(f => eventos.push({ data, inicio: '', fim: '', evento: f.evento, local: f.local, endereco: f.endereco, lat: null, lng: null, aviso: '' }));
  }
  if (tipo === 'hoje' && !eventos.some(ev => ev.data === hoje)) {
    const f = AGENDA_FIXA_DEMO[1];
    eventos.unshift({ data: hoje, inicio: '', fim: '', evento: '', local: f.local, endereco: f.endereco, lat: null, lng: null, aviso: '' });
  }
  return { ok: true, eventos };
}

async function buscarAgenda(){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 15000);
  try {
    const resp = await fetch(URL_CARDAPIO + (URL_CARDAPIO.includes('?') ? '&' : '?') + 'action=agenda', { cache: 'no-store', signal: ctrl.signal });
    const dados = await resp.json();
    if (!dados || dados.ok !== true || !Array.isArray(dados.eventos)) throw new Error('resposta inesperada');
    return dados;
  } finally {
    clearTimeout(timer);
  }
}

async function iniciarAgenda(){
  const demo = new URLSearchParams(location.search).get('demo');
  if (demo) {
    const aviso = document.getElementById('avisoDemo');
    aviso.hidden = false;
    aviso.textContent = '🧪 Página de teste (' + demo + '): agenda fixa de quinta e sábado, ainda sem horário' + (demo === 'hoje' ? '; finge que hoje é dia de 7 de setembro' : '') + '.';
    renderAgenda(agendaDemo(demo));
    return;
  }
  if (!URL_CARDAPIO) { renderAgenda(null); return; }
  try {
    renderAgenda(await buscarAgenda());
  } catch (err) {
    console.warn('agenda: falha ao buscar da planilha', err);
    renderAgenda(null);
  }
}

// ---------------------------------------------------------------------------
// início: mostra o último cardápio guardado no aparelho na hora e atualiza
// pela planilha em seguida.
// ---------------------------------------------------------------------------
async function iniciar(){
  renderLinks();
  mostrarTela();
  iniciarAgenda();
  if (!URL_CARDAPIO) {
    render(DADOS_EXEMPLO);
    return;
  }
  const cache = lerCache();
  if (cache) { render(cache); renderAtualizado(cache); }
  try {
    const dados = await buscarCardapio();
    // Planilha veio sem nenhum prato (aba Menu apagada ou com erro): continua
    // mostrando o último cardápio bom guardado no aparelho e não o substitui.
    if (!montarCategorias(dados.itens).length && cache && montarCategorias(cache.itens).length) {
      console.warn('cardápio: planilha veio vazia, mantendo o último cardápio guardado');
      return;
    }
    gravarCache(dados);
    // não redesenha com a foto aberta, para não fechar o que a pessoa está vendo
    if (zoomAtual < 0) { render(dados); renderAtualizado(dados); }
  } catch (err) {
    console.warn('cardápio: falha ao buscar da planilha', err);
    if (!cache) renderErro();
  }
}

iniciar();
</script>
<script>
// Recebe a figura (figures/foodtruck.js chama hairline({...})) e monta no palco da tela inicial.
window.hairline = (figure) => {
  const stage = document.querySelector('[data-truck]'), label = document.querySelector('[data-truck-read]');
  if (!stage || !window.HL) return;
  HL.inject(document);
  stage.setAttribute('data-hairline', figure.name);
  const svg = HL.mk('svg', { viewBox: '0 0 400 320', 'aria-hidden': 'true' }, stage);
  const nomes = { rest: 'Bem-vindo ao Narua!' };
  const read = { set textContent(v) { const pct = /(\d+)%/.exec(v); label.textContent = pct && +pct[1] >= 50 ? 'janela aberta!' : nomes.rest; }, get textContent() { return label.textContent; } };
  figure.mount({ stage, svg, read }, figure.range[1]);
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) HL.tour(stage, figure.tour || HL.LAP, () => {});
};
</script>
